name: documind-test

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
      POSTGRES_DB: documind_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U documind -d documind_test" ]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:2026.08.0
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?Set LOCALSTACK_AUTH_TOKEN in the root .env}
      SERVICES: s3
      PERSISTENCE: "0"
      DOCUMIND_S3_BUCKET: documind-documents-test
      DOCUMIND_S3_REGION: ${DOCUMIND_S3_REGION:?Set DOCUMIND_S3_REGION in the root .env}
    ports:
      - "127.0.0.1:4567:4566"
    volumes:
      - ./infrastructure/localstack/init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test:
        - CMD
        - awslocal
        - s3api
        - head-bucket
        - --bucket
        - documind-documents-test
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:8
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
